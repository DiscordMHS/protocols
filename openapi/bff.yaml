openapi: 3.0.3
info:
  title: BFF API
  description: Backend For Frontend API
  version: 0.0.1
servers:
  - url: https://api.agoraproject.ru
    description: Production server
  - url: http://localhost:8080
    description: Local development server
tags:
  - name: GuildService
    description: Проксирование запросов в Guild Service
  - name: AuthService
    description: Проксирование запросов в Auth Service
  - name: UserService
    description: Проксирование запросов в User Service
  - name: MembershipService
    description: Проксирование запросов в Membership Service
paths:
  /api/v1/guild/{id}:
    get:
      tags:
        - GuildService
      summary: Получить гильдию по ID
      description: Проксирует запрос в guild-service для получения информации о гильдии
      operationId: getGuildById
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ID гильдии
          schema:
            type: integer
            format: uint64
            minimum: 1
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Guild'
        '400':
          description: Неверный запрос
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Гильдия не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    patch:
      tags:
        - GuildService
      summary: Обновить гильдию
      description: Проксирует запрос в guild-service для обновления информации о гильдии
      operationId: updateGuild
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ID гильдии
          schema:
            type: integer
            format: uint64
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateGuildRequest'
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Guild'
        '400':
          description: Неверный запрос
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Гильдия не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      tags:
        - GuildService
      summary: Удалить гильдию
      description: Проксирует запрос в guild-service для удаления гильдии
      operationId: deleteGuild
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ID гильдии
          schema:
            type: integer
            format: uint64
            minimum: 1
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteGuildResponse'
        '400':
          description: Неверный запрос
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Гильдия не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/guild:
    post:
      tags:
        - GuildService
      summary: Создать гильдию
      description: Проксирует запрос в guild-service для создания новой гильдии
      operationId: createGuild
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGuildRequest'
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Guild'
        '400':
          description: Неверный запрос
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/guild/page/{page}:
    get:
      tags:
        - GuildService
      summary: Получить публичные гильдии
      description: Проксирует запрос в guild-service для получения списка публичных гильдий (лимит 20 на странице)
      operationId: getPublicGuilds
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: path
          required: true
          description: Номер страницы
          schema:
            type: integer
            format: uint64
            minimum: 1
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetPublicGuildsPageResponse'
        '400':
          description: Неверный запрос
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'


  /api/v1/guilds/my:
    get:
      tags:
        - GuildService
      summary: Получить мои гильдии
      description: Проксирует запрос в guild-service для получения списка гильдий текущего пользователя
      operationId: getMyGuilds
      security:
        - BearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          description: Максимальное количество гильдий для возврата
          schema:
            type: integer
            format: uint64
            minimum: 1
        - name: offset
          in: query
          required: false
          description: Смещение для пагинации
          schema:
            type: integer
            format: uint64
            minimum: 0
        - name: search
          in: query
          required: false
          description: Поисковый запрос для фильтрации гильдий
          schema:
            type: string
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetMyGuildsResponse'
        '400':
          description: Неверный запрос
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # =====================
  # Auth Service
  # =====================

  /api/v1/auth/register:
    post:
      tags:
        - AuthService
      summary: Регистрация нового пользователя
      description: Проксирует запрос в auth-service для регистрации нового пользователя
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '400':
          description: Неверный запрос
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/auth/login:
    post:
      tags:
        - AuthService
      summary: Вход пользователя
      description: Проксирует запрос в auth-service для входа и получения JWT токенов
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Неверный запрос
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/auth/refresh:
    post:
      tags:
        - AuthService
      summary: Обновить JWT токены
      description: Проксирует запрос в auth-service для обновления access токена по refresh токену
      operationId: refresh
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshResponse'
        '400':
          description: Неверный запрос
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/auth/verify-email:
    get:
      tags:
        - AuthService
      summary: Верификация email
      description: Проксирует запрос в auth-service для верификации email по токену
      operationId: verifyEmail
      parameters:
        - name: token
          in: query
          required: true
          description: Токен верификации
          schema:
            type: string
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyEmailResponse'
        '400':
          description: Неверный запрос
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/auth/forgot-password:
    post:
      tags:
        - AuthService
      summary: Забыли пароль
      description: Проксирует запрос в auth-service для отправки письма для сброса пароля
      operationId: forgotPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForgotPasswordResponse'
        '400':
          description: Неверный запрос
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/auth/reset-password:
    post:
      tags:
        - AuthService
      summary: Сброс пароля
      description: Проксирует запрос в auth-service для установки нового пароля по токену
      operationId: resetPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResetPasswordResponse'
        '400':
          description: Неверный запрос
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/auth/me:
    get:
      tags:
        - AuthService
      summary: Получить текущего пользователя
      description: Проксирует запрос в auth-service для получения информации о текущем аутентифицированном пользователе
      operationId: getMe
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetMeResponse'

  # =====================
  # User Service
  # =====================

  /api/v1/users:
    get:
      tags:
        - UserService
      summary: Список пользователей
      description: Проксирует запрос в auth-service для получения списка всех пользователей с пагинацией
      operationId: listUsers
      security:
        - BearerAuth: []
      parameters:
        - name: limit
          in: query
          description: Максимальное количество пользователей
          schema:
            type: integer
            format: uint64
        - name: offset
          in: query
          description: Смещение для пагинации
          schema:
            type: integer
            format: uint64
        - name: search
          in: query
          description: Поисковый запрос
          schema:
            type: string
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListUsersResponse'
        '400':
          description: Неверный запрос
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      tags:
        - UserService
      summary: Создать пользователя
      description: Проксирует запрос в auth-service для создания нового пользователя (только для администраторов)
      operationId: createUser
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateUserResponse'
        '400':
          description: Неверный запрос
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/users/{id}:
    get:
      tags:
        - UserService
      summary: Получить пользователя по ID
      description: Проксирует запрос в auth-service для получения информации о пользователе по ID
      operationId: getUser
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ID пользователя
          schema:
            type: string
            format: uint64
            minimum: 1
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetUserResponse'
        '400':
          description: Неверный запрос
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Пользователь не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    put:
      tags:
        - UserService
      summary: Обновить пользователя
      description: Проксирует запрос в auth-service для обновления информации о пользователе
      operationId: updateUser
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ID пользователя
          schema:
            type: string
            format: uint64
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateUserResponse'
        '400':
          description: Неверный запрос
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Пользователь не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      tags:
        - UserService
      summary: Удалить пользователя
      description: Проксирует запрос в auth-service для мягкого удаления пользователя
      operationId: deleteUser
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ID пользователя
          schema:
            type: string
            format: uint64
            minimum: 1
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteUserResponse'
        '400':
          description: Неверный запрос
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Пользователь не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/users/{id}/change-password:
    post:
      tags:
        - UserService
      summary: Изменить пароль пользователя
      description: Проксирует запрос в auth-service для изменения пароля пользователя
      operationId: changePassword
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ID пользователя
          schema:
            type: string
            format: uint64
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangePasswordResponse'
        '400':
          description: Неверный запрос
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # =====================
  # Membership Service
  # =====================

  /api/v1/guilds/{guild_id}/roles:
    post:
      tags:
        - MembershipService
      summary: Создать роль
      description: Проксирует запрос в membership-service для создания новой роли в гильдии
      operationId: createRole
      security:
        - BearerAuth: []
      parameters:
        - name: guild_id
          in: path
          required: true
          description: ID гильдии
          schema:
            type: string
            format: uint64
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRoleRequest'
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateRoleResponse'
        '400':
          description: Неверный запрос
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    get:
      tags:
        - MembershipService
      summary: Список ролей гильдии
      description: Проксирует запрос в membership-service для получения списка ролей гильдии с пагинацией
      operationId: listRoles
      security:
        - BearerAuth: []
      parameters:
        - name: guild_id
          in: path
          required: true
          description: ID гильдии
          schema:
            type: string
            format: uint64
            minimum: 1
        - name: limit
          in: query
          description: Максимальное количество ролей
          schema:
            type: integer
            format: uint64
        - name: offset
          in: query
          description: Смещение для пагинации
          schema:
            type: integer
            format: uint64
        - name: query
          in: query
          description: Поисковый запрос по названию роли
          schema:
            type: string
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListRolesResponse'
        '400':
          description: Неверный запрос
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/guilds/{guild_id}/roles/{role_id}:
    get:
      tags:
        - MembershipService
      summary: Получить роль
      description: Проксирует запрос в membership-service для получения информации о роли
      operationId: getRole
      security:
        - BearerAuth: []
      parameters:
        - name: guild_id
          in: path
          required: true
          description: ID гильдии
          schema:
            type: string
            format: uint64
            minimum: 1
        - name: role_id
          in: path
          required: true
          description: ID роли
          schema:
            type: string
            format: uint64
            minimum: 1
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetRoleResponse'
        '400':
          description: Неверный запрос
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Роль не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    put:
      tags:
        - MembershipService
      summary: Обновить роль
      description: Проксирует запрос в membership-service для обновления роли и замены списка разрешений
      operationId: updateRole
      security:
        - BearerAuth: []
      parameters:
        - name: guild_id
          in: path
          required: true
          description: ID гильдии
          schema:
            type: string
            format: uint64
            minimum: 1
        - name: role_id
          in: path
          required: true
          description: ID роли
          schema:
            type: string
            format: uint64
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRoleRequest'
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateRoleResponse'
        '400':
          description: Неверный запрос
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Роль не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      tags:
        - MembershipService
      summary: Удалить роль
      description: Проксирует запрос в membership-service для удаления роли из гильдии
      operationId: deleteRole
      security:
        - BearerAuth: []
      parameters:
        - name: guild_id
          in: path
          required: true
          description: ID гильдии
          schema:
            type: string
            format: uint64
            minimum: 1
        - name: role_id
          in: path
          required: true
          description: ID роли
          schema:
            type: string
            format: uint64
            minimum: 1
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteRoleResponse'
        '400':
          description: Неверный запрос
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Роль не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/guilds/{guild_id}/members:
    post:
      tags:
        - MembershipService
      summary: Добавить участника в гильдию
      description: Проксирует запрос в membership-service для добавления пользователя в гильдию с указанными ролями
      operationId: createMember
      security:
        - BearerAuth: []
      parameters:
        - name: guild_id
          in: path
          required: true
          description: ID гильдии
          schema:
            type: string
            format: uint64
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMemberRequest'
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateMemberResponse'
        '400':
          description: Неверный запрос
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    get:
      tags:
        - MembershipService
      summary: Список участников гильдии
      description: Проксирует запрос в membership-service для получения списка участников гильдии с пагинацией
      operationId: listMembers
      security:
        - BearerAuth: []
      parameters:
        - name: guild_id
          in: path
          required: true
          description: ID гильдии
          schema:
            type: string
            format: uint64
            minimum: 1
        - name: limit
          in: query
          description: Максимальное количество участников
          schema:
            type: integer
            format: uint64
        - name: offset
          in: query
          description: Смещение для пагинации
          schema:
            type: integer
            format: uint64
        - name: query
          in: query
          description: Поисковый запрос по имени пользователя
          schema:
            type: string
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListMembersResponse'
        '400':
          description: Неверный запрос
          content:
