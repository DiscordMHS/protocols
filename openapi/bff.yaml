components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT Bearer token для аутентификации
  schemas:
    Guild:
      type: object
      required:
        - id
        - ownerId
        - title
        - visibility
      properties:
        id:
          type: integer
          format: uint64
          description: ID гильдии
          minimum: 1
        ownerId:
          type: integer
          format: uint64
          description: ID владельца гильдии
          minimum: 1
        title:
          type: string
          description: Название гильдии
        description:
          type: string
          description: Описание гильдии
        avatarUrl:
          type: string
          format: uri
          description: URL аватара гильдии
          nullable: true
        wallpaperUrl:
          type: string
          format: uri
          description: URL обоев гильдии
          nullable: true
        visibility:
          type: string
          enum:
            - PUBLIC
            - PRIVATE
          description: Видимость гильдии
    CreateGuildRequest:
      type: object
      required:
        - title
      properties:
        title:
          type: string
          description: Название гильдии
        description:
          type: string
          description: Описание гильдии
          nullable: true
        visibility:
          type: string
          enum:
            - PUBLIC
            - PRIVATE
          description: Видимость гильдии
          nullable: true
    UpdateGuildRequest:
      type: object
      properties:
        title:
          type: string
          description: Название гильдии
          nullable: true
        description:
          type: string
          description: Описание гильдии
          nullable: true
        avatarUrl:
          type: string
          format: uri
          description: URL аватара гильдии
          nullable: true
        wallpaperUrl:
          type: string
          format: uri
          description: URL обоев гильдии
          nullable: true
        visibility:
          type: string
          enum:
            - PUBLIC
            - PRIVATE
          description: Видимость гильдии
          nullable: true
    DeleteGuildResponse:
      type: object
      description: Пустой ответ при успешном удалении
    GetPublicGuildsPageResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Guild'
          description: Список гильдий
        total:
          type: integer
          format: uint64
          description: Общее количество гильдий
    GetMyGuildsResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Guild'
          description: Список гильдий текущего пользователя
        total:
          type: integer
          format: uint64
          description: Общее количество гильдий
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: Код ошибки
        message:
          type: string
          description: Сообщение об ошибке

    # =====================
    # Auth Service Schemas
    # =====================

    RegisterRequest:
      type: object
      required:
        - email
        - username
        - password
      properties:
        email:
          type: string
          format: email
          description: Email пользователя
        username:
          type: string
          description: Имя пользователя
        password:
          type: string
          minLength: 8
          maxLength: 64
          description: Пароль пользователя

    RegisterResponse:
      type: object
      description: Пустой ответ при успешной регистрации

    LoginRequest:
      type: object
      required:
        - password
      properties:
        email:
          type: string
          format: email
          description: 'Email пользователя (один из email или username)'
        username:
          type: string
          minLength: 3
          maxLength: 64
          description: 'Имя пользователя (один из email или username)'
        password:
          type: string
          minLength: 8
          maxLength: 64
          description: Пароль пользователя

    LoginResponse:
      type: object
      properties:
        tokens:
          $ref: '#/components/schemas/Tokens'

    Tokens:
      type: object
      properties:
        access_token:
          type: string
          description: Access JWT токен
        refresh_token:
          type: string
          description: Refresh JWT токен

    RefreshRequest:
      type: object
      required:
        - refresh_token
      properties:
        refresh_token:
          type: string
          description: Refresh токен

    RefreshResponse:
      type: object
      properties:
        tokens:
          $ref: '#/components/schemas/Tokens'

    VerifyEmailResponse:
      type: object
      description: Пустой ответ при успешной верификации

    ForgotPasswordRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
          description: Email пользователя

    ForgotPasswordResponse:
      type: object
      description: Пустой ответ при успешной отправке письма

    ResetPasswordRequest:
      type: object
      required:
        - token
        - new_password
      properties:
        token:
          type: string
          description: Токен сброса пароля
        new_password:
          type: string
          minLength: 8
          maxLength: 64
          description: Новый пароль

    ResetPasswordResponse:
      type: object
      description: Пустой ответ при успешном сбросе пароля

    GetMeResponse:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'

    # =====================
    # User Service Schemas
    # =====================

    User:
      type: object
      properties:
        id:
          type: string
          format: uint64
          description: ID пользователя
        username:
          type: string
          description: Имя пользователя
        email:
          type: string
          format: email
          description: Email пользователя
        email_verified:
          type: boolean
          description: Статус верификации email
        first_name:
          type: string
          description: Имя
        last_name:
          type: string
          description: Фамилия
        second_name:
          type: string
          description: Отчество
        about_me:
          type: string
          description: О себе
        status:
          type: string
          description: Статус пользователя
        avatar_url:
          type: string
          format: uri
          description: URL аватара
        is_deleted:
          type: boolean
          description: Удален ли пользователь
        last_online:
          type: string
          format: date-time
          description: Время последнего онлайна
        created_at:
          type: string
          format: date-time
          description: Дата создания
        updated_at:
          type: string
          format: date-time
          description: Дата обновления

    ListUsersResponse:
      type: object
      properties:
        users:
          type: array
          items:
            $ref: '#/components/schemas/User'
          description: Список пользователей

    GetUserResponse:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'

    CreateUserRequest:
      type: object
      required:
        - email
        - username
        - password
      properties:
        email:
          type: string
          format: email
          description: Email пользователя
        username:
          type: string
          description: Имя пользователя
        password:
          type: string
          description: Пароль пользователя
        email_verified:
          type: boolean
          description: Статус верификации email
        first_name:
          type: string
          description: Имя
        last_name:
          type: string
          description: Фамилия
        second_name:
          type: string
          description: Отчество
        about_me:
          type: string
          description: О себе
        status:
          type: string
          description: Статус пользователя
        avatar_url:
          type: string
          format: uri
          description: URL аватара
        is_deleted:
          type: boolean
          description: Удален ли пользователь

    CreateUserResponse:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'

    UpdateUserRequest:
      type: object
      required:
        - id
      properties:
        id:
          type: string
          format: uint64
          description: ID пользователя
        username:
          type: string
          description: Имя пользователя
        email:
          type: string
          format: email
          description: Email пользователя
        email_verified:
          type: boolean
          description: Статус верификации email
        first_name:
          type: string
          description: Имя
        last_name:
          type: string
          description: Фамилия
        second_name:
          type: string
          description: Отчество
        about_me:
          type: string
          description: О себе
        status:
          type: string
          description: Статус пользователя
        avatar_url:
          type: string
          format: uri
          description: URL аватара
        is_deleted:
          type: boolean
          description: Удален ли пользователь

    UpdateUserResponse:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'

    ChangePasswordRequest:
      type: object
      required:
        - id
        - current_password
        - new_password
      properties:
        id:
          type: string
          format: uint64
          description: ID пользователя
        current_password:
          type: string
          description: Текущий пароль
        new_password:
          type: string
          description: Новый пароль

    ChangePasswordResponse:
      type: object
      description: Пустой ответ при успешном изменении пароля

    DeleteUserResponse:
      type: object
      description: Пустой ответ при успешном удалении

    # =====================
    # Membership Service Schemas
    # =====================

    Permission:
      type: object
      required:
        - permission
        - resource
        - allow
      properties:
        permission:
          type: string
          description: Название разрешения (например, "view_channel", "send_messages")
        resource:
          type: string
          description: Путь к ресурсу (например, "guild/{guild_id}/channel/{channel_id}")
        allow:
          type: boolean
          description: Разрешить (true) или запретить (false)

    Role:
      type: object
      properties:
        id:
          type: string
          format: uint64
          description: ID роли
        guild_id:
          type: string
          format: uint64
          description: ID гильдии
        title:
          type: string
          description: Название роли
        icon:
          type: string
          format: uri
          nullable: true
          description: URL иконки роли
        is_default:
          type: boolean
          description: Роль по умолчанию для новых участников
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/Permission'
          description: Список разрешений роли

    Member:
      type: object
      properties:
        user_id:
          type: string
          format: uint64
          description: ID пользователя
        guild_id:
          type: string
          format: uint64
          description: ID гильдии
        role_ids:
          type: array
          items:
            type: string
            format: uint64
          description: Список ID ролей участника
        joined_at:
          type: string
          format: date-time
          description: Дата присоединения к гильдии

    RoleOverride:
      type: object
      required:
        - role_id
        - permission
        - resource
        - allow
      properties:
        role_id:
          type: string
          format: uint64
          description: ID роли
        permission:
          type: string
          description: Название разрешения
        resource:
          type: string
          description: Путь к ресурсу
        allow:
          type: boolean
          description: Разрешить (true) или запретить (false)

    UserOverride:
      type: object
      required:
        - user_id
        - permission
        - resource
        - allow
      properties:
        user_id:
          type: string
          format: uint64
          description: ID пользователя
        permission:
          type: string
          description: Название разрешения
        resource:
          type: string
          description: Путь к ресурсу
