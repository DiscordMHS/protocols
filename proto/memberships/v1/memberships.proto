syntax = "proto3";

package memberships.v1;

option go_package = "github.com/DiscordMHS/protocols/gen/go/memberships/v1;membershipsv1";

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "protoc-gen-openapiv2/options/annotations.proto";

// =====================
// === OpenAPI Info ====
// =====================
option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  info : {
    title : "Membership Service API"
    version : "1.0.0"
    description : "Guild memberships, roles, and permissions management service"
  }
  schemes : HTTP
  schemes : HTTPS
  consumes : "application/json"
  produces : "application/json"
  security_definitions: {
    security: {
      key: "BearerAuth"
      value: {
        type: TYPE_API_KEY
        name: "Authorization"
        in: IN_HEADER
        description: "JWT Bearer token"
      }
    }
  }
  host: "memberships.agoraproject.ru"
};

// ==========================
// ======= SERVICES =========
// ==========================

service MembershipService {
  // =====================
  // === ROLES ===========
  // =====================

  // CreateRole creates a new role in the specified guild with the given permissions.
  rpc CreateRole(CreateRoleRequest) returns (CreateRoleResponse) {
    option (google.api.http) = {
      post : "/api/v1/guilds/{guild_id}/roles"
      body : "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags : "Roles"
      summary : "Create a new role"
      description : "Creates a new role in the guild with specified title, icon, and permissions. The role can be marked as default for new members."
      security: {
        security_requirement: {
          key: "BearerAuth";
          value: {}
        }
      }
    };
  }

  // ListRoles retrieves a paginated list of roles for the specified guild.
  rpc ListRoles(ListRolesRequest) returns (ListRolesResponse) {
    option (google.api.http) = {
      get : "/api/v1/guilds/{guild_id}/roles"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags : "Roles"
      summary : "List guild roles"
      description : "Returns a paginated list of all roles in the guild. Supports filtering by query string and pagination with limit and offset."
      security: {
        security_requirement: {
          key: "BearerAuth";
          value: {}
        }
      }
    };
  }

  // GetRole retrieves a specific role by its ID.
  rpc GetRole(GetRoleRequest) returns (GetRoleResponse) {
    option (google.api.http) = {
      get : "/api/v1/guilds/{guild_id}/roles/{role_id}"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags : "Roles"
      summary : "Get role"
      description : "Returns detailed information about a specific role, including all its permissions."
      security: {
        security_requirement: {
          key: "BearerAuth";
          value: {}
        }
      }
    };
  }

  // UpdateRole updates role metadata and completely replaces its permissions list.
  rpc UpdateRole(UpdateRoleRequest) returns (UpdateRoleResponse) {
    option (google.api.http) = {
      put : "/api/v1/guilds/{guild_id}/roles/{role_id}"
      body : "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags : "Roles"
      summary : "Update role"
      description : "Updates role metadata (title, icon, is_default) and completely replaces the list of permissions. All fields are required."
      security: {
        security_requirement: {
          key: "BearerAuth";
          value: {}
        }
      }
    };
  }

  // DeleteRole removes a role from the guild. Members with this role will lose it.
  rpc DeleteRole(DeleteRoleRequest) returns (DeleteRoleResponse) {
    option (google.api.http) = {
      delete : "/api/v1/guilds/{guild_id}/roles/{role_id}"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags : "Roles"
      summary : "Delete role"
      description : "Permanently deletes a role from the guild. All members with this role will lose it."
      security: {
        security_requirement: {
          key: "BearerAuth";
          value: {}
        }
      }
    };
  }

  // InitRoles initializes default roles (owner and member) for a guild.
  rpc InitRoles(InitRolesRequest) returns (InitRolesResponse) {
    option (google.api.http) = {
      post : "/api/v1/guilds/{guild_id}/roles/init"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags : "Roles"
      summary : "Initialize default roles"
      description : "Creates two default roles for the guild: owner (with all permissions) and member (with limited permissions)."
      security: {
        security_requirement: {
          key: "BearerAuth";
          value: {}
        }
      }
    };
  }

  // =====================
  // === MEMBERS =========
  // =====================

  // CreateMember adds a user to the guild with the specified roles.
  rpc CreateMember(CreateMemberRequest) returns (CreateMemberResponse) {
    option (google.api.http) = {
      post : "/api/v1/guilds/{guild_id}/members"
      body : "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags : "Members"
      summary : "Add member to guild"
      description : "Adds a user to the guild with the specified roles. The user must exist in the system."
      security: {
        security_requirement: {
          key: "BearerAuth";
          value: {}
        }
      }
    };
  }

  // JoinGuild allows the authenticated user to join a guild on their own.
  rpc JoinGuild(JoinGuildRequest) returns (JoinGuildResponse) {
    option (google.api.http) = {
      post : "/api/v1/guilds/{guild_id}/join"
      body : "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags : "Members"
      summary : "Join guild"
      description : "Allows the authenticated user to join a guild. The user will be assigned default roles if available."
      security: {
        security_requirement: {
          key: "BearerAuth";
          value: {}
        }
      }
    };
  }

  // GetMember retrieves membership information for a specific user in the guild.
  rpc GetMember(GetMemberRequest) returns (GetMemberResponse) {
    option (google.api.http) = {
      get : "/api/v1/guilds/{guild_id}/members/{user_id}"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags : "Members"
      summary : "Get guild member"
      description : "Returns membership information for a specific user, including their roles and join date."
      security: {
        security_requirement: {
          key: "BearerAuth";
          value: {}
        }
      }
    };
  }

  // ListMembers retrieves a paginated list of guild members.
  rpc ListMembers(ListMembersRequest) returns (ListMembersResponse) {
    option (google.api.http) = {
      get : "/api/v1/guilds/{guild_id}/members"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags : "Members"
      summary : "List guild members"
      description : "Returns a paginated list of all members in the guild. Supports filtering by username query and pagination with limit and offset."
      security: {
        security_requirement: {
          key: "BearerAuth";
          value: {}
        }
      }
    };
  }

  // UpdateMemberRoles completely replaces the set of roles assigned to a member.
  rpc UpdateMemberRoles(UpdateMemberRolesRequest) returns (UpdateMemberRolesResponse) {
    option (google.api.http) = {
      put : "/api/v1/guilds/{guild_id}/members/{user_id}/roles"
      body : "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags : "Members"
      summary : "Update member roles"
      description : "Completely replaces the member's role set with the provided list. Empty list removes all roles."
      security: {
        security_requirement: {
          key: "BearerAuth";
          value: {}
        }
      }
    };
  }

  // DeleteMember removes a user from the guild and all associated overrides.
  rpc DeleteMember(DeleteMemberRequest) returns (DeleteMemberResponse) {
    option (google.api.http) = {
      delete : "/api/v1/guilds/{guild_id}/members/{user_id}"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags : "Members"
      summary : "Remove member from guild"
      description : "Permanently removes a user from the guild. All their roles and channel overrides are deleted."
      security: {
        security_requirement: {
          key: "BearerAuth";
          value: {}
        }
      }
    };
  }

  // GetUserGuilds retrieves all guilds a user is a member of.
  rpc GetUserGuilds(GetUserGuildsRequest) returns (GetUserGuildsResponse) {
    option (google.api.http) = {
      get : "/api/v1/users/{user_id}/guilds"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags : "Members"
      summary : "Get user guilds"
      description : "Returns a list of all guilds the user is a member of, including pagination support."
      security: {
        security_requirement: {
          key: "BearerAuth";
          value: {}
        }
      }
    };
  }

  // =====================
  // === INVITES =========
  // =====================

  // CreateInvite generates an invite link for the guild or specific channel.
  rpc CreateInvite(CreateInviteRequest) returns (CreateInviteResponse) {
    option (google.api.http) = {
      post : "/api/v1/guilds/{guild_id}/invites"
      body : "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags : "Invites"
      summary : "Create invite link"
      description : "Generates a new invite token and URL for the guild. Optionally can be scoped to a specific channel."
      security: {
        security_requirement: {
          key: "BearerAuth";
          value: {}
        }
      }
    };
  }

  // AcceptInvite accepts an invite using the provided token and adds the user to the guild.
  rpc AcceptInvite(AcceptInviteRequest) returns (AcceptInviteResponse) {
    option (google.api.http) = {
      post : "/api/v1/invites/{token}/accept"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags : "Invites"
      summary : "Accept invite"
      description : "Accepts an invite by token. The authenticated user is added to the guild/channel specified in the invite."
      security: {
        security_requirement: {
          key: "BearerAuth";
          value: {}
        }
      }
    };
  }

  // =====================
  // === OVERRIDES =======
  // =====================

  // UpdateRoleOverrides completely replaces role-based permission overrides for a resource.
  rpc UpdateRoleOverrides(UpdateRoleOverridesRequest) returns (UpdateRoleOverridesResponse) {
    option (google.api.http) = {
      put : "/api/v1/overrides/roles"
      body : "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags : "Overrides"
      summary : "Update role overrides"
      description : "Completely replaces all role-based permission overrides for the resource. Empty list removes all overrides."
      security: {
        security_requirement: {
          key: "BearerAuth";
          value: {}
        }
      }
    };
  }

  // UpdateUserOverrides completely replaces user-specific permission overrides for a resource.
  rpc UpdateUserOverrides(UpdateUserOverridesRequest) returns (UpdateUserOverridesResponse) {
    option (google.api.http) = {
      put : "/api/v1/overrides/users"
      body : "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags : "Overrides"
      summary : "Update user overrides"
      description : "Completely replaces all user-specific permission overrides for the resource. Empty list removes all overrides."
      security: {
        security_requirement: {
          key: "BearerAuth";
          value: {}
        }
      }
    };
  }

  // GetRoleOverrides retrieves role-based permission overrides for a resource.
  rpc GetRoleOverrides(GetRoleOverridesRequest) returns (GetRoleOverridesResponse) {
    option (google.api.http) = {
      get : "/api/v1/overrides/roles"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags : "Overrides"
      summary : "Get role overrides"
      description : "Retrieves all role-based permission overrides for the specified resource."
      security: {
        security_requirement: {
          key: "BearerAuth";
          value: {}
        }
      }
    };
  }

  // GetUserOverrides retrieves user-specific permission overrides for a resource.
  rpc GetUserOverrides(GetUserOverridesRequest) returns (GetUserOverridesResponse) {
    option (google.api.http) = {
      get : "/api/v1/overrides/users"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags : "Overrides"
      summary : "Get user overrides"
      description : "Retrieves all user-specific permission overrides for the specified resource."
      security: {
        security_requirement: {
          key: "BearerAuth";
          value: {}
        }
      }
    };
  }

  // =====================
  // === PERMISSIONS =====
  // =====================

  // CheckPermission verifies if a user has the specified permission for a resource.
  rpc CheckPermission(CheckPermissionRequest) returns (CheckPermissionResponse) {
    option (google.api.http) = {
      post : "/api/v1/permissions/check"
      body : "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags : "Permissions"
      summary : "Check permission"
      description : "Checks if a user has the specified permission for the given resource. Considers roles, overrides, and inheritance."
      security: {
        security_requirement: {
          key: "BearerAuth";
          value: {}
        }
      }
    };
  }

  // GetPermissions retrieves all available permission names in the system.
  rpc GetPermissions(GetPermissionsRequest) returns (GetPermissionsResponse) {
    option (google.api.http) = {
      get : "/api/v1/permissions"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags : "Permissions"
      summary : "Get all available permissions"
      description : "Returns a list of all available permission names in the system. Useful for displaying permission options when creating or editing roles."
      security: {
        security_requirement: {
          key: "BearerAuth";
          value: {}
        }
      }
    };
  }
}

// =====================
// ==== MESSAGES =======
// =====================

// Permission represents a single permission rule for a resource.
message Permission {
  // Permission name (e.g., "view_channel", "send_messages", "manage_guild").
  string permission = 1 [ (buf.validate.field).required = true ];
  // Resource path (e.g., "guild/{guild_id}/channel/{channel_id}").
  string resource = 2 [ (buf.validate.field).required = true ];
  // Whether the permission is allowed (true) or denied (false).
  bool allow = 3 [ (buf.validate.field).required = true ];
}

// Role represents a role in a guild with associated permissions.
message Role {
  // Unique role identifier.
  uint64 id = 1;
  // Guild identifier this role belongs to.
  uint64 guild_id = 2;
  // Role display title.
  string title = 3;
  // Optional icon URL for the role.
  optional string icon = 4;
  // Whether this role is assigned to new members by default.
  bool is_default = 5;
  // List of permissions associated with this role.
  repeated Permission permissions = 6;
}

// Member represents a user's membership in a guild.
message Member {
  // User identifier.
  uint64 user_id = 1;
  // Guild identifier.
  uint64 guild_id = 2;
  // List of role IDs assigned to this member.
  repeated uint64 role_ids = 3;
  // Timestamp when the user joined the guild.
  google.protobuf.Timestamp joined_at = 4;
}

// RoleOverride represents a resource-specific permission override for a role.
message RoleOverride {
  // Role identifier.
  uint64 role_id = 1 [ (buf.validate.field).required = true ];
  // Permission name.
  string permission = 2 [ (buf.validate.field).required = true ];
  // Resource path.
  string resource = 3 [ (buf.validate.field).required = true ];
  // Whether the permission is allowed (true) or denied (false).
  bool allow = 4 [ (buf.validate.field).required = true ];
}

// UserOverride represents a resource-specific permission override for a user.
message UserOverride {
  // User identifier.
  uint64 user_id = 1 [ (buf.validate.field).required = true ];
  // Permission name.
  string permission = 2 [ (buf.validate.field).required = true ];
  // Resource path.
  string resource = 3 [ (buf.validate.field).required = true ];
  // Whether the permission is allowed (true) or denied (false).
  bool allow = 4 [ (buf.validate.field).required = true ];
}

// =====================
// === ROLES ===========
// =====================

message CreateRoleRequest {
  // Guild identifier where the role will be created.
  uint64 guild_id = 1 [ (buf.validate.field).required = true ];
  // Role display title.
  string title = 2 [ (buf.validate.field).required = true ];
  // Optional icon URL.
  optional string icon = 3;
  // Whether this role should be assigned to new members by default.
  bool is_default = 4;
  // Initial list of permissions for this role.
  repeated Permission permissions = 5;
}

message CreateRoleResponse {
  // Created role with generated ID.
  Role role = 1;
}

message ListRolesRequest {
  // Guild identifier.
  uint64 guild_id = 1 [ (buf.validate.field).required = true ];
  // Maximum number of roles to return (default: 20).
  int32 limit = 2;
  // Number of roles to skip for pagination (default: 0).
  int32 offset = 3;
  // Optional search query to filter roles by title.
  string query = 4;
}

message ListRolesResponse {
  // List of roles.
  repeated Role items = 1;
  // Total number of roles matching the query.
  int32 total = 2;
}

message GetRoleRequest {
  // Guild identifier.
  uint64 guild_id = 1 [ (buf.validate.field).required = true ];
  // Role identifier.
  uint64 role_id = 2 [ (buf.validate.field).required = true ];
}

message GetRoleResponse {
  // Role information.
  Role role = 1;
}

message UpdateRoleRequest {
  // Guild identifier.
  uint64 guild_id = 1 [ (buf.validate.field).required = true ];
  // Role identifier to update.
  uint64 role_id = 2 [ (buf.validate.field).required = true ];
  // New role title.
  string title = 3 [ (buf.validate.field).required = true ];
  // New icon URL (optional).
  optional string icon = 4;
  // Whether role should be default.
  bool is_default = 5;
  // New permissions list (completely replaces existing permissions).
  repeated Permission permissions = 6;
}

message UpdateRoleResponse {
  // Updated role.
  Role role = 1;
}

message DeleteRoleRequest {
  // Guild identifier.
  uint64 guild_id = 1 [ (buf.validate.field).required = true ];
  // Role identifier to delete.
  uint64 role_id = 2 [ (buf.validate.field).required = true ];
}

message DeleteRoleResponse {}

message InitRolesRequest {
  // Guild identifier where roles will be initialized.
  uint64 guild_id = 1 [ (buf.validate.field).required = true ];
}

message InitRolesResponse {
  // Created owner role with all permissions.
  Role owner_role = 1;
  // Created member role with limited permissions.
  Role member_role = 2;
}

// =====================
// === MEMBERS =========
// =====================

message CreateMemberRequest {
  // Guild identifier.
  uint64 guild_id = 1 [ (buf.validate.field).required = true ];
  // User identifier to add to the guild.
  uint64 user_id = 2 [ (buf.validate.field).required = true ];
  // Initial roles to assign to the member.
  repeated uint64 role_ids = 3;
}

message CreateMemberResponse {
  // Created membership information.
  Member member = 1;
}

message JoinGuildRequest {
  // Guild identifier to join.
  uint64 guild_id = 1 [ (buf.validate.field).required = true ];
}

message JoinGuildResponse {
  // Membership information after joining.
  Member member = 1;
}

message GetMemberRequest {
  // Guild identifier.
  uint64 guild_id = 1 [ (buf.validate.field).required = true ];
  // User identifier.
  uint64 user_id = 2 [ (buf.validate.field).required = true ];
}

message GetMemberResponse {
  // Member information.
  Member member = 1;
}

message ListMembersRequest {
  // Guild identifier.
  uint64 guild_id = 1 [ (buf.validate.field).required = true ];
  // Maximum number of members to return (default: 20).
  int32 limit = 2;
  // Number of members to skip for pagination (default: 0).
  int32 offset = 3;
  // Optional search query to filter members by username.
  string query = 4;
}

message ListMembersResponse {
  // List of members.
  repeated Member items = 1;
  // Total number of members matching the query.
  int32 total = 2;
}

message UpdateMemberRolesRequest {
  // Guild identifier.
  uint64 guild_id = 1 [ (buf.validate.field).required = true ];
  // User identifier.
  uint64 user_id = 2 [ (buf.validate.field).required = true ];
  // New list of role IDs (completely replaces existing roles).
  repeated uint64 role_ids = 3;
}

message UpdateMemberRolesResponse {
  // Updated member information.
  Member member = 1;
}

message DeleteMemberRequest {
  // Guild identifier.
  uint64 guild_id = 1 [ (buf.validate.field).required = true ];
  // User identifier to remove from the guild.
  uint64 user_id = 2 [ (buf.validate.field).required = true ];
}

message DeleteMemberResponse {}

message GetUserGuildsRequest {
  // User identifier.
  uint64 user_id = 1 [ (buf.validate.field).required = true ];
  // Maximum number of guilds to return (default: 20).
  int32 limit = 2;
  // Number of guilds to skip for pagination (default: 0).
  int32 offset = 3;
}

message GetUserGuildsResponse {
  // List of guild IDs the user is a member of.
  repeated uint64 guild_ids = 1;
  // Total number of guilds the user is a member of.
  int32 total = 2;
}

// =====================
// === INVITES =========
// =====================

message CreateInviteRequest {
  // Guild identifier.
  uint64 guild_id = 1 [ (buf.validate.field).required = true ];
  // Optional channel identifier to scope the invite to a specific channel.
  optional uint64 channel_id = 2;
}

message CreateInviteResponse {
  // Invite token (can be used in invite URL).
  string token = 1;
  // Full invite URL.
  string invite_url = 2;
  // Guild identifier.
  uint64 guild_id = 3;
  // Channel identifier if invite is channel-specific.
  optional uint64 channel_id = 4;
  // Timestamp when the invite expires (null if never expires).
  google.protobuf.Timestamp expires_at = 5;
  // Maximum number of uses (0 if unlimited).
  int32 max_uses = 6;
  // Current number of uses.
  int32 uses = 7;
  // Timestamp when the invite was created.
  google.protobuf.Timestamp created_at = 8;
}

message AcceptInviteRequest {
  // Invite token from the invite URL.
  string token = 1 [ (buf.validate.field).required = true ];
}

message AcceptInviteResponse {
  // Guild identifier the user joined.
  uint64 guild_id = 1;
  // Channel identifier if invite was channel-specific.
  optional uint64 channel_id = 2;
  // User identifier who accepted the invite.
  uint64 user_id = 3;
  // Timestamp when the user joined.
  google.protobuf.Timestamp joined_at = 4;
}

// =====================
// === OVERRIDES =======
// =====================

message UpdateRoleOverridesRequest {
  // Resource path.
  string resource = 1 [ (buf.validate.field).required = true ];
  // List of role overrides (completely replaces existing overrides).
  repeated RoleOverride overrides = 2;
}

message UpdateRoleOverridesResponse {
  // Resource path.
  string resource = 1;
  // Updated list of role overrides.
  repeated RoleOverride overrides = 2;
}

message UpdateUserOverridesRequest {
  // Resource path.
  string resource = 1 [ (buf.validate.field).required = true ];
  // List of user overrides (completely replaces existing overrides).
  repeated UserOverride overrides = 2;
}

message UpdateUserOverridesResponse {
  // Resource path.
  string resource = 1;
  // Updated list of user overrides.
  repeated UserOverride overrides = 2;
}

message GetRoleOverridesRequest {
  // Resource path.
  string resource = 1 [ (buf.validate.field).required = true ];
}

message GetRoleOverridesResponse {
  // Resource path.
  string resource = 1;
  // List of role overrides.
  repeated RoleOverride overrides = 2;
}

message GetUserOverridesRequest {
  // Resource path.
  string resource = 1 [ (buf.validate.field).required = true ];
}

message GetUserOverridesResponse {
  // Resource path.
  string resource = 1;
  // List of user overrides.
  repeated UserOverride overrides = 2;
}

// =====================
// === PERMISSIONS =====
// =====================

message CheckPermissionRequest {
  // User identifier to check permissions for.
  uint64 user_id = 1 [ (buf.validate.field).required = true ];
  // Resource path to check (e.g., "guild/{guild_id}/channel/{channel_id}").
  string resource = 2 [ (buf.validate.field).required = true ];
  // Permission name to check (e.g., "send_messages", "view_channel").
  string permission = 3 [ (buf.validate.field).required = true ];
}

message CheckPermissionResponse {
  // Whether the user has the requested permission.
  bool allowed = 1;
}

message GetPermissionsRequest {
  // Empty request - no parameters needed to get all available permissions.
}

message GetPermissionsResponse {
  // List of all available permission names in the system.
  repeated string permissions = 1;
}

