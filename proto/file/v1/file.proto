syntax = "proto3";

package file.v1;

option go_package = "github.com/DiscordMHS/protocols/gen/go/file/v1;file";

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";

option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  info : {
    title : "File Service API"
    version : "0.0.1"
    description: "Service for uploading files to object storage and returning permanent URLs"
  }
  schemes : HTTP
  schemes : HTTPS
  consumes : "multipart/form-data"
  produces : "application/json"
  security_definitions: {
    security: {
      key: "BearerAuth"
      value: {
        type: TYPE_API_KEY
        name: "Authorization"
        in: IN_HEADER
        description: "JWT Bearer token"
      }
    }
  },
  host: "filemanager.agoraproject.ru"
};

service FileService {
  // Uploads a file, validates its MIME type, stores it in MinIO, and returns a permanent URL.
  rpc UploadFile(UploadFileRequest) returns (UploadFileResponse) {
    option (google.api.http) = {
      post : "/api/v1/files"
      body : "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags : "FileService"
      summary : "Upload file and get permanent URL"
      consumes: "multipart/form-data"
      produces: "application/json"
      security: {
        security_requirement: {
          key: "BearerAuth";
          value: {}
        }
      }
    };
  };
}

message UploadFileRequest {
  // File to upload. In HTTP this is a multipart/form-data field named \"file\".
  bytes file = 1 [
    (buf.validate.field).required = true,
    (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
      type: STRING
      format: "binary"
      description: "File to upload"
    }
  ];
}

message UploadFileResponse {
  // Permanent URL of the stored file.
  string url = 1 [
    (buf.validate.field).string.uri = true
  ];

  // Size of the stored file in bytes.
  uint64 size = 2 [
    (buf.validate.field).uint64.gt = 0
  ];

  // MIME type detected by the service.
  string mime_type = 3 [
    (buf.validate.field).required = true
  ];
}


