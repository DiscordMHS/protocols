syntax = "proto3";

package channel.v1;

option go_package = "github.com/DiscordMHS/protocols/gen/go/channel/v1;channel";

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";

option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  info : {
    title : "Channel Service API"
    version : "0.0.1"
    description: "Channel Management Service"
  }
  schemes : HTTP
  schemes : HTTPS
  consumes : "application/json"
  produces : "application/json"
  security_definitions: {
    security: {
      key: "BearerAuth"
      value: {
        type: TYPE_API_KEY
        name: "Authorization"
        in: IN_HEADER
        description: "JWT Bearer token"
      }
    }
  }
};

service ChannelService {
  rpc GetTextChannelById(GetTextChannelByIdRequest) returns (GetTextChannelByIdResponse) {
    option (google.api.http) = {
      get : "/api/v1/textchannel/{id}"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags : "ChannelService"
      summary : "Get text channel by Id"
      security: {
        security_requirement: {
          key: "BearerAuth";
          value: {}
        }
      }
    };
  };

  rpc GetTextChannelByGuildId(GetTextChannelByGuildIdRequest) returns (GetTextChannelByGuildIdResponse) {
    option (google.api.http) = {
      get : "/api/v1/textchannel/guild/{id}"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags : "ChannelService"
      summary : "Get text channel by Guild Id"
      security: {
        security_requirement: {
          key: "BearerAuth";
          value: {}
        }
      }
    };
  };

  rpc GetVoiceChannelById(GetVoiceChannelByIdRequest) returns (GetVoiceChannelByIdResponse) {
    option (google.api.http) = {
      get : "/api/v1/voicechannel/{id}"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags : "ChannelService"
      summary : "Get voice channel by Id"
      security: {
        security_requirement: {
          key: "BearerAuth";
          value: {}
        }
      }
    };
  };

  rpc GetVoiceChannelByGuildId(GetVoiceChannelByGuildIdRequest) returns (GetVoiceChannelByGuildIdResponse) {
    option (google.api.http) = {
      get : "/api/v1/voicechannel/guild/{id}"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags : "ChannelService"
      summary : "Get voice channel by Guild Id"
      security: {
        security_requirement: {
          key: "BearerAuth";
          value: {}
        }
      }
    };
  };

  rpc CreateTextChannel(CreateTextChannelRequest) returns (CreateTextChannelResponse) {
    option (google.api.http) = {
      post : "/api/v1/textchannel"
      body : "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags : "ChannelService"
      summary : "Create text channel"
      security: {
        security_requirement: {
          key: "BearerAuth";
          value: {}
        }
      }
    };
  };

  rpc UpdateTextChannel(UpdateTextChannelRequest) returns (UpdateTextChannelResponse) {
    option (google.api.http) = {
      put : "/api/v1/textchannel/{id}"
      body : "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags : "ChannelService"
      summary : "Update text channel"
      security: {
        security_requirement: {
          key: "BearerAuth";
          value: {}
        }
      }
    };
  };

  rpc DeleteTextChannel(DeleteTextChannelRequest) returns (DeleteTextChannelResponse) {
    option (google.api.http) = {
      delete : "/api/v1/textchannel/{id}"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags : "ChannelService"
      summary : "Delete text channel"
      security: {
        security_requirement: {
          key: "BearerAuth";
          value: {}
        }
      }
    };
  };

  rpc CreateVoiceChannel(CreateVoiceChannelRequest) returns (CreateVoiceChannelResponse) {
    option (google.api.http) = {
      post : "/api/v1/voicechannel"
      body : "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags : "ChannelService"
      summary : "Create voice channel"
      security: {
        security_requirement: {
          key: "BearerAuth";
          value: {}
        }
      }
    };
  };

  rpc UpdateVoiceChannel(UpdateVoiceChannelRequest) returns (UpdateVoiceChannelResponse) {
    option (google.api.http) = {
      put : "/api/v1/voicechannel/{id}"
      body : "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags : "ChannelService"
      summary : "Update voice channel"
      security: {
        security_requirement: {
          key: "BearerAuth";
          value: {}
        }
      }
    };
  };

  rpc DeleteVoiceChannel(DeleteVoiceChannelRequest) returns (DeleteVoiceChannelResponse) {
    option (google.api.http) = {
      delete : "/api/v1/voicechannel/{id}"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags : "ChannelService"
      summary : "Delete voice channel"
      security: {
        security_requirement: {
          key: "BearerAuth";
          value: {}
        }
      }
    };
  };

}

// region Text Channel
message GetTextChannelByIdRequest {
    uint64 id = 1 [
    (buf.validate.field).uint64.gt = 0
  ];
}

message GetTextChannelByIdResponse {
    TextChannel channel = 1;
}

message GetTextChannelByGuildIdRequest {
    uint64 id = 1 [
    (buf.validate.field).uint64.gt = 0
  ];
}

message GetTextChannelByGuildIdResponse {
    repeated TextChannel channel = 1;
}

message TextChannel {
  uint64 id = 1 [
    (buf.validate.field).uint64.gt = 0
  ];
  uint64 guild_id = 2 [
    (buf.validate.field).uint64.gt = 0
  ];
  string title = 3 [
    (buf.validate.field).required = true
  ];
  optional string description = 4;
  bool nsfw = 5;
  optional uint32 slowmode = 6;
  int32 position = 7;
  bool is_archived = 8;
}

message CreateTextChannelRequest {
  uint64 guild_id = 1 [
    (buf.validate.field).uint64.gt = 0
  ];
  string title = 2 [
    (buf.validate.field).required = true
  ];
  optional string description = 3;
  bool nsfw = 4;
  optional uint32 slowmode = 5;
  int32 position = 6;
}

message CreateTextChannelResponse {
  TextChannel channel = 1;
}

message UpdateTextChannelRequest {
  uint64 id = 1 [
    (buf.validate.field).uint64.gt = 0
  ];
  optional string title = 2;
  optional string description = 3;
  optional bool nsfw = 4;
  optional uint32 slowmode = 5;
  optional int32 position = 6;
  optional bool is_archived = 7;
}

message UpdateTextChannelResponse {
  TextChannel channel = 1;
}

message DeleteTextChannelRequest {
  uint64 id = 1 [
    (buf.validate.field).uint64.gt = 0
  ];
}

message DeleteTextChannelResponse {}
// endregion

// region Voice Channel
message GetVoiceChannelByIdRequest {
    uint64 id = 1 [
    (buf.validate.field).uint64.gt = 0
  ];
}

message GetVoiceChannelByIdResponse {
    VoiceChannel channel = 1;
}

message GetVoiceChannelByGuildIdRequest {
    uint64 id = 1 [
    (buf.validate.field).uint64.gt = 0
  ];
}

message GetVoiceChannelByGuildIdResponse {
    repeated VoiceChannel channel = 1;
}

message VoiceChannel {
  uint64 id = 1 [
    (buf.validate.field).uint64.gt = 0
  ];
  uint64 guild_id = 2 [
    (buf.validate.field).uint64.gt = 0
  ];
  string title = 3 [
    (buf.validate.field).required = true
  ];
  int32 position = 4;
  uint32 user_limit = 5;
}

message CreateVoiceChannelRequest {
  uint64 guild_id = 1 [
    (buf.validate.field).uint64.gt = 0
  ];
  string title = 2 [
    (buf.validate.field).required = true
  ];
  int32 position = 3;
  uint32 user_limit = 4;
}

message CreateVoiceChannelResponse {
  VoiceChannel channel = 1;
}

message UpdateVoiceChannelRequest {
  uint64 id = 1 [
    (buf.validate.field).uint64.gt = 0
  ];
  optional string title = 2;
  optional int32 position = 3;
  optional uint32 user_limit = 4;
}

message UpdateVoiceChannelResponse {
  VoiceChannel channel = 1;
}

message DeleteVoiceChannelRequest {
  uint64 id = 1 [
    (buf.validate.field).uint64.gt = 0
  ];
}

message DeleteVoiceChannelResponse {}
// endregion
