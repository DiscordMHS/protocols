syntax = "proto3";

package guild.v1;

option go_package = "github.com/DiscordMHS/protocols/gen/go/guild/v1;guild";

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";

option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  info : {
    title : "Guild Service API"
    version : "0.0.1"
    description: "Guild Management Service"
  }
  schemes : HTTP
  schemes : HTTPS
  consumes : "application/json"
  produces : "application/json"
  security_definitions: {
    security: {
      key: "BearerAuth"
      value: {
        type: TYPE_API_KEY
        name: "Authorization"
        in: IN_HEADER
        description: "JWT Bearer token"
      }
    }
  }
};

service GuildService {
  rpc GetGuildById(GetGuildByIdRequest) returns (Guild) {
    option (google.api.http) = {
      get : "/api/v1/guild/{id}"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags : "Guild"
      security: {
        security_requirement: {
          key: "BearerAuth";
          value: {}
        }
      }
    };
  };

  rpc GetPublicGuilds(GetPublicGuildsPageRequest) returns (GetPublicGuildsPageResponse) {
    option (google.api.http) = {
        get : "/api/v1/guild/page/{page}"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags : "Guild"
      security: {
        security_requirement: {
          key: "BearerAuth";
          value: {}
        }
      }
    };
  };

  rpc CreateGuild(CreateGuildRequest) returns (CreateGuildResponse) {
    option (google.api.http) = {
      post : "/api/v1/guild"
      body : "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags : "Guild"
      security: {
        security_requirement: {
          key: "BearerAuth";
          value: {}
        }
      }
    };
  };

  rpc UpdateGuild(UpdateGuildRequest) returns (UpdateGuildResponse) {
    option (google.api.http) = {
      put : "/api/v1/guild/{id}"
      body : "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags : "Guild"
      security: {
        security_requirement: {
          key: "BearerAuth";
          value: {}
        }
      }
    };
  };

  rpc DeleteGuild(DeleteGuildRequest) returns (DeleteGuildResponse) {
    option (google.api.http) = {
      delete : "/api/v1/guild/{id}"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags : "Guild"
      security: {
        security_requirement: {
          key: "BearerAuth";
          value: {}
        }
      }
    };
  };
}

message GetGuildByIdRequest {
  uint64 id = 1 [
    (buf.validate.field).uint64.gt = 0
  ];
}

message GetPublicGuildsPageResponse {
    repeated Guild guilds = 1;
    uint64 total_pages = 2;
    uint64 current_page = 3;
}

message GetPublicGuildsPageRequest {
    uint64 page = 1 [
        (buf.validate.field).uint64.gt = 0
    ];
}

message CreateGuildRequest {
    string title = 1 [
      (buf.validate.field).required = true
    ];
    optional string description = 2;
    optional uint32 visibility = 3;
}

message CreateGuildResponse {
  Guild guild = 1;
}

message UpdateGuildRequest {
    uint64 id = 1 [
      (buf.validate.field).required = true
    ];
    optional string title = 2;
    optional string description = 3;
    optional string avatar_url = 4;
    optional string wallpaper_url = 5;
    optional uint32 visibility = 6;
}

message UpdateGuildResponse {
  Guild guild = 1;
}

message DeleteGuildRequest {
  uint64 id = 1 [
    (buf.validate.field).required = true
  ];
}

message DeleteGuildResponse {}

message Guild {
  uint64 id = 1 [
    (buf.validate.field).uint64.gt = 0
  ];
  uint64 owner_id = 2 [
    (buf.validate.field).uint64.gt = 0
  ];
  string title = 3 [
    (buf.validate.field).required = true
  ];
  string description = 4;
  optional string avatar_url = 5 [
    (buf.validate.field).string.uri = true
  ];
  optional string wallpaper_url = 6 [
    (buf.validate.field).string.uri = true
  ];
  uint32 visibility = 7 [
    (buf.validate.field).uint32.gt = 0
  ];
}
